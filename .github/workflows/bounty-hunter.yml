name: AUTONOMY-CLAW Bounty Hunter

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      bounty_type:
        description: 'Type of bounty to hunt'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - documentation
          - security
          - dependency
          - test
          - translation

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
  PAYPAL_SECRET: ${{ secrets.PAYPAL_SECRET }}

jobs:
  # Job 1: Documentation Bounties
  documentation-bounties:
    runs-on: ubuntu-latest
    if: github.event.inputs.bounty_type == 'documentation' || github.event.inputs.bounty_type == 'all' || github.event_name == 'schedule'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install requests
          pip install beautifulsoup4
          
      - name: Run Documentation Bounty Hunter
        run: |
          cd .github/scripts
          python3 documentation_hunter.py
          
      - name: Upload bounty results
        uses: actions/upload-artifact@v4
        with:
          name: documentation-bounties
          path: bounties/documentation/*.json
          retention-days: 30

  # Job 2: Security Bounties
  security-bounties:
    runs-on: ubuntu-latest
    if: github.event.inputs.bounty_type == 'security' || github.event.inputs.bounty_type == 'all' || github.event_name == 'schedule'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install security tools
        run: |
          pip install requests
          pip install safety
          pip install bandit
          
      - name: Run Security Bounty Hunter
        run: |
          cd .github/scripts
          python3 security_hunter.py
          
      - name: Upload security results
        uses: actions/upload-artifact@v4
        with:
          name: security-bounties
          path: bounties/security/*.json
          retention-days: 30

  # Job 3: Dependency Bounties
  dependency-bounties:
    runs-on: ubuntu-latest
    if: github.event.inputs.bounty_type == 'dependency' || github.event.inputs.bounty_type == 'all' || github.event_name == 'schedule'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependency tools
        run: |
          npm install -g npm-check-updates
          pip install requests
          
      - name: Run Dependency Bounty Hunter
        run: |
          cd .github/scripts
          python3 dependency_hunter.py
          
      - name: Upload dependency results
        uses: actions/upload-artifact@v4
        with:
          name: dependency-bounties
          path: bounties/dependency/*.json
          retention-days: 30

  # Job 4: Test Coverage Bounties
  test-bounties:
    runs-on: ubuntu-latest
    if: github.event.inputs.bounty_type == 'test' || github.event.inputs.bounty_type == 'all' || github.event_name == 'schedule'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install test tools
        run: |
          pip install requests
          pip install pytest
          pip install coverage
          
      - name: Run Test Bounty Hunter
        run: |
          cd .github/scripts
          python3 test_hunter.py
          
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-bounties
          path: bounties/test/*.json
          retention-days: 30

  # Job 5: Translation Bounties
  translation-bounties:
    runs-on: ubuntu-latest
    if: github.event.inputs.bounty_type == 'translation' || github.event.inputs.bounty_type == 'all' || github.event_name == 'schedule'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install translation tools
        run: |
          pip install requests
          pip install googletrans==4.0.0-rc1
          
      - name: Run Translation Bounty Hunter
        run: |
          cd .github/scripts
          python3 translation_hunter.py
          
      - name: Upload translation results
        uses: actions/upload-artifact@v4
        with:
          name: translation-bounties
          path: bounties/translation/*.json
          retention-days: 30

  # Job 6: Process and Submit PRs
  submit-prs:
    runs-on: ubuntu-latest
    needs: [documentation-bounties, security-bounties, dependency-bounties, test-bounties, translation-bounties]
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install GitHub CLI
        run: |
          type -p curl >/dev/null || (sudo apt update && sudo apt install curl -y)
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh -y
          
      - name: Download all bounty artifacts
        uses: actions/download-artifact@v4
        with:
          path: bounties
          merge-multiple: true
          
      - name: Install Python dependencies
        run: |
          pip install requests
          
      - name: Process and Submit Verified PRs
        run: |
          cd .github/scripts
          python3 batch_submitter.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Upload submission results
        uses: actions/upload-artifact@v4
        with:
          name: pr-submissions
          path: submissions/*.json
          retention-days: 90

  # Job 7: Monitor Existing PRs
  monitor-prs:
    runs-on: ubuntu-latest
    needs: submit-prs
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install GitHub CLI
        run: |
          type -p curl >/dev/null || (sudo apt update && sudo apt install curl -y)
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh -y
          
      - name: Monitor PR Status
        run: |
          cd .github/scripts
          python3 pr_monitor.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Upload monitoring results
        uses: actions/upload-artifact@v4
        with:
          name: pr-monitoring
          path: monitoring/*.json
          retention-days: 90

  # Job 8: Generate Daily Report
  daily-report:
    runs-on: ubuntu-latest
    needs: [submit-prs, monitor-prs]
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Generate Report
        run: |
          cd .github/scripts
          python3 generate_report.py
          
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: daily-report
          path: reports/*.md
          retention-days: 365
          
      - name: Create Issue for Results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('artifacts/daily-report/*.md', 'utf8');
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `AUTONOMY-CLAW Daily Report - ${new Date().toISOString().split('T')[0]}`,
              body: report,
              labels: ['automation', 'bounty-hunter']
            });
