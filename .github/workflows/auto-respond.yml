name: Auto-Respond to Bounty Comments

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  auto-respond:
    runs-on: ubuntu-latest
    if: contains(github.event.comment.body, 'AUTONOMY-CLAW') || contains(github.event.issue.labels.*.name, 'automation')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: pip install requests
        
      - name: Generate Response
        id: generate
        run: |
          COMMENT="${{ github.event.comment.body }}"
          
          # Simple response logic
          if echo "$COMMENT" | grep -qi "thank"; then
            RESPONSE="You're welcome! Happy to help. 🤖"
          elif echo "$COMMENT" | grep -qi "fix\|change\|update"; then
            RESPONSE="I'll look into that right away. Thanks for the feedback! 🤖"
          elif echo "$COMMENT" | grep -qi "?"; then
            RESPONSE="Good question! The automated fixes focus on code quality improvements. Let me know if you need clarification on any changes. 🤖"
          else
            RESPONSE="Thanks for the review! Please let me know if any changes are needed. 🤖"
          fi
          
          echo "response=$RESPONSE" >> $GITHUB_OUTPUT
          
      - name: Post Response
        uses: actions/github-script@v7
        with:
          script: |
            const response = '${{ steps.generate.outputs.response }}';
            
            if (context.eventName === 'issue_comment') {
              github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: response
              });
            } else {
              github.rest.pulls.createReplyForReviewComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                comment_id: context.payload.comment.id,
                body: response
              });
            }
